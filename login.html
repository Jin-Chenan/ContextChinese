<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Context Chinese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600;700;900&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDE4D2;
  --paper-deep:#E1D4B9;
  --paper-shadow:#cbbb96;
  --ink:#22241F;
  --ink-soft:#514E42;
  --seal:#AE3B1C;
  --seal-dark:#8C2E15;
  --jade:#3E6B5B;
  --jade-dark:#2E5346;
  --gold:#A9832E;
  --slate:#4C6169;
  --paper-rgb:237,228,210;
  --radius:2px;
  --serif-cn:'Noto Serif SC', serif;
  --serif-en:'Zilla Slab', 'Noto Serif', serif;
  --sans:'Inter', sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(0,0,0,0.025) 0, transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(0,0,0,0.03) 0, transparent 50%);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.5;
}
::selection{background:var(--seal); color:var(--paper);}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--seal); outline-offset:2px;}

.login-wrap{width:100%; max-width:380px; padding:24px;}
.login-brand{display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:28px;}
.login-brand .seal-mark{
  width:52px; height:52px; background:var(--seal); color:var(--paper);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif-cn); font-size:28px; font-weight:700;
  border-radius:3px; transform:rotate(-3deg);
  box-shadow:2px 2px 0 rgba(0,0,0,0.15);
}
.login-brand b{font-family:var(--serif-en); font-size:22px; letter-spacing:0.3px;}

.login-card{
  background:rgba(255,255,255,0.5); border:1px solid var(--paper-shadow);
  border-radius:2px; padding:32px 28px;
}
.login-field{margin-bottom:16px;}
.login-field label{
  display:block; font-size:12px; text-transform:uppercase; letter-spacing:1px;
  color:var(--ink-soft); margin-bottom:6px; font-weight:600;
}
.login-field input{
  width:100%; padding:10px 14px; border:1.5px solid var(--paper-shadow); border-radius:2px;
  background:rgba(255,255,255,0.6); font-size:15px; font-family:var(--sans); outline:none;
  color:var(--ink);
}
.login-field input:focus{border-color:var(--ink);}

.btn{
  background:var(--ink); color:var(--paper); border:none; cursor:pointer;
  padding:10px 18px; font-weight:600; font-size:13.5px; border-radius:2px;
  letter-spacing:0.3px; transition:transform .12s, background .12s;
}
.btn:hover{background:var(--seal-dark);}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:0.5; cursor:not-allowed;}
.login-submit{width:100%; margin-top:6px;}

.login-error{color:var(--seal-dark); font-size:13px; margin-top:12px; min-height:18px;}
.login-toggle{text-align:center; margin-top:18px; font-size:13px; color:var(--ink-soft);}
.login-toggle button{
  background:none; border:none; color:var(--seal); font-weight:700; cursor:pointer;
  text-decoration:underline; padding:0; font-size:13px; font-family:inherit;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <div class="seal-mark">境</div>
    <b>Context Chinese</b>
  </div>

  <div class="login-card">
    <div class="login-field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="email">
    </div>
    <div class="login-field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn login-submit" id="submitBtn" onclick="submitAuth()">Log In</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-toggle">
      <span id="toggleText">Need an account?</span>
      <button onclick="toggleMode()" id="toggleBtn">Sign up</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let mode = 'login'; // 'login' | 'signup'

function toggleMode(){
  mode = mode === 'login' ? 'signup' : 'login';
  document.getElementById('submitBtn').textContent = mode === 'login' ? 'Log In' : 'Sign Up';
  document.getElementById('toggleText').textContent = mode === 'login' ? 'Need an account?' : 'Already have an account?';
  document.getElementById('toggleBtn').textContent = mode === 'login' ? 'Sign up' : 'Log in';
  document.getElementById('loginError').textContent = '';
}

function getRedirectTarget(){
  const params = new URLSearchParams(location.search);
  return params.get('redirect') || 'index.html';
}

function submitAuth(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  if(!email || !password){
    errorEl.textContent = 'Enter both an email and a password.';
    return;
  }
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  try{
    const action = mode === 'login'
      ? firebase.auth().signInWithEmailAndPassword(email, password)
      : firebase.auth().createUserWithEmailAndPassword(email, password);
    action
      .then(function(){ location.replace(getRedirectTarget()); })
      .catch(function(err){ errorEl.textContent = err.message; submitBtn.disabled = false; });
  }catch(e){
    errorEl.textContent = 'Firebase is not set up yet — check firebase-config.js.';
    submitBtn.disabled = false;
  }
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter') submitAuth();
});

try{
  firebase.auth().onAuthStateChanged(function(user){
    if(user) location.replace(getRedirectTarget());
  });
}catch(e){
  document.getElementById('loginError').textContent = 'Firebase is not set up yet — check firebase-config.js.';
}
</script>
</body>
</html>
