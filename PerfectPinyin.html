<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <title>My Custom Pinyin Trainer</title> 
    <style> 
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #f4f4f9; 
            padding: 50px; 
        } 
        #box { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            display: inline-block; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        } 
        #char { 
            font-size: 80px; 
            margin: 0 0 20px 0; 
            font-weight: bold; 
            color: #333; 
        } 
        input { 
            font-size: 24px; 
            padding: 10px; 
            text-align: center; 
            border: 2px solid #ccc; 
            border-radius: 6px; 
            outline: none; 
            width: 250px; 
            display: block; 
            margin: 0 auto 20px auto; 
        } 
        input.correct { 
            border-color: #4caf50; 
            background: #e8f5e9; 
        } 
        /* Button Layout Group */
        .btn-group { 
            margin: 15px 0; 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
        } 
        button { 
            font-size: 16px; 
            padding: 10px 18px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.2s; 
            display: inline-block; 
        } 
        /* Orange Play Audio Button Style Restored */
        #audioBtn { 
            background-color: #ff9800; 
            color: white; 
        } 
        #audioBtn:hover { 
            background-color: #e68a00; 
        } 
        /* Blue Reveal Button Style */
        #revealBtn { 
            background-color: #007bff; 
            color: white; 
        } 
        #revealBtn:hover { 
            background-color: #0056b3; 
        } 
        /* Red Text Style for Revealed Answer */
        #pinyinReveal { 
            font-size: 24px; 
            color: #ff5722; 
            font-weight: bold; 
            margin: 10px 0; 
            min-height: 35px; 
        } 
        /* Tone Guide Container */
        #toneKey { 
            margin-top: 25px; 
            border-top: 1px dashed #ccc; 
            padding-top: 15px; 
            font-size: 14px; 
            color: #888; 
            line-height: 1.6; 
            text-align: center; 
            display: block; 
        } 
        .guide-title { 
            margin-bottom: 5px; 
        } 
        .code-inline { 
            background: #eee; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-family: monospace; 
            font-size: 13px; 
            color: #666; 
        } 
    </style> 
</head> 
<body> 

<div id="box"> 
    <div id="char"></div> 
    <input type="text" id="input" autofocus autocomplete="off" placeholder="Type pinyin..." lang="en"> 
    
    <!-- Red Answer Text Placeholder Box -->
    <div id="pinyinReveal"></div> 
    
    <!-- Control Buttons -->
    <div class="btn-group"> 
        <button id="audioBtn" type="button">🔊 Play Audio</button> 
        <button id="revealBtn" type="button">Reveal Answer</button> 
    </div> 
    
    <!-- Restored Tone Chart Content -->
    <div id="toneKey"> 
        <div class="guide-title">Type regular letters, then press 1-4 for tones:</div> 
        <div><b>a</b> &rarr; <span class="code-inline">a1=ā</span>, <span class="code-inline">a2=á</span>, <span class="code-inline">a3=ǎ</span>, <span class="code-inline">a4=à</span></div> 
        <div><b>e</b> &rarr; <span class="code-inline">e1=ē</span>, <span class="code-inline">e2=é</span>, <span class="code-inline">e3=ě</span>, <span class="code-inline">e4=è</span></div> 
        <div><b>i</b> &rarr; <span class="code-inline">i1=ī</span>, <span class="code-inline">i2=í</span>, <span class="code-inline">i3=ǐ</span>, <span class="code-inline">i4=ì</span></div> 
        <div><b>o</b> &rarr; <span class="code-inline">o1=ō</span>, <span class="code-inline">o2=ó</span>, <span class="code-inline">o3=ǒ</span>, <span class="code-inline">o4=ò</span></div> 
        <div><b>u</b> &rarr; <span class="code-inline">u1=ū</span>, <span class="code-inline">u2=ú</span>, <span class="code-inline">u3=ǔ</span>, <span class="code-inline">u4=ù</span></div> 
        <div><b>v</b> &rarr; <span class="code-inline">v1=ǖ</span>, <span class="code-inline">v2=ǘ</span>, <span class="code-inline">v3=ǚ</span>, <span class="code-inline">v4=ǜ</span></div> 
    </div> 
</div> 

<script> 
// EXTENDED VOCABULARY ARRAY
const vocab = [ 
    {word: "课", pinyin: "kè"}, 
    {word: "你好", pinyin: "nǐhǎo"}, 
    {word: "风水", pinyin: "fēngshuǐ"}, 
    {word: "上海", pinyin: "Shànghǎi"}, 
    {word: "北京", pinyin: "běijīng"}, 
    {word: "南京", pinyin: "Nánjīng"}, 
    {word: "扬州", pinyin: "Yángzhōu"}, 
    {word: "中国", pinyin: "zhōngguó"}, 
    {word: "中国城", pinyin: "Zhōngguóchéng"}, 
    {word: "美国", pinyin: "Měiguó"}, 
    {word: "英国", pinyin: "Yīngguó"}, 
    {word: "韩国", pinyin: "Hánguó"}, 
]; 

let currentIdx = 0; 

function shuffle(array) { 
    for (let i = array.length - 1; i > 0; i--) { 
        const j = Math.floor(Math.random() * (i + 1)); 
        [array[i], array[j]] = [array[j], array[i]]; 
    } 
} 
shuffle(vocab); 

const charEl = document.getElementById('char'); 
const inputEl = document.getElementById('input'); 
const audioBtn = document.getElementById('audioBtn'); 
const revealBtn = document.getElementById('revealBtn'); 
const pinyinRevealEl = document.getElementById('pinyinReveal'); 
const toneKeyEl = document.getElementById('toneKey'); 

const toneMap = { 
    'a': ['ā', 'á', 'ǎ', 'à'], 'e': ['ē', 'é', 'ě', 'è'], 'o': ['ō', 'ó', 'ǒ', 'ò'], 
    'i': ['ī', 'í', 'ǐ', 'ì'], 'u': ['ū', 'ú', 'ǔ', 'ù'], 'v': ['ǖ', 'ǘ', 'ǚ', 'ǜ'], 
    'ü': ['ǖ', 'ǘ', 'ǚ', 'ǜ'] 
}; 

// Functional rule map logic 
function addToneMark(text, toneNum) { 
    if (toneNum < 1 || toneNum > 4) return text; 
    const idx = toneNum - 1; 
    
    if (text.includes('a')) return text.replace('a', toneMap['a'][idx]); 
    if (text.includes('e')) return text.replace('e', toneMap['e'][idx]); 
    if (text.includes('ou')) return text.replace('o', toneMap['o'][idx]); 
    if (text.includes('ui')) return text.replace('i', toneMap['i'][idx]); 
    if (text.includes('iu')) return text.replace('u', toneMap['u'][idx]); 
    
    for (let i = text.length - 1; i >= 0; i--) { 
        let char = text[i]; 
        if (toneMap[char]) { 
            return text.substring(0, i) + toneMap[char][idx] + text.substring(i + 1); 
        } 
    } 
    return text; 
} 

function loadWord() { 
    if (currentIdx >= vocab.length) { 
        charEl.textContent = "🎉 Done!"; 
        inputEl.style.display = 'none'; 
        audioBtn.style.display = 'none'; 
        revealBtn.style.display = 'none'; 
        toneKeyEl.style.display = 'none'; 
        pinyinRevealEl.style.display = 'none'; 
        return; 
    } 
    charEl.textContent = vocab[currentIdx].word; 
    inputEl.value = ""; 
    inputEl.className = ""; 
    pinyinRevealEl.textContent = ""; 
    inputEl.focus(); 
} 

// Web Speech Synthesis engine 
function speakCurrentWord() { 
    if (currentIdx >= vocab.length) return; 
    window.speechSynthesis.cancel(); 
    const text = vocab[currentIdx].word; 
    const utterance = new SpeechSynthesisUtterance(text); 
    utterance.lang = 'zh-CN'; 
    window.speechSynthesis.speak(utterance); 
} 

// Audio Button click event 
audioBtn.addEventListener('click', speakCurrentWord); 

// Reveal answer and safely add the word to the back of the deck without duplicates 
revealBtn.addEventListener('click', () => { 
    if (currentIdx >= vocab.length) return; 
    pinyinRevealEl.textContent = vocab[currentIdx].pinyin; 
    inputEl.value = ""; 
    const missedWord = vocab[currentIdx]; 
    if (vocab[vocab.length - 1] !== missedWord) { 
        vocab.push(missedWord); 
    } 
    inputEl.focus(); 
}); 

// Cursor-aware event listener that isolates current syllables 
inputEl.addEventListener('keydown', (e) => { 
    if (e.key >= '1' && e.key <= '4') { 
        e.preventDefault(); 
        let toneNum = parseInt(e.key); 
        let val = inputEl.value; 
        if (!val) return; 

        // 1. Get current typing cursor position 
        let cursorIdx = inputEl.selectionStart; 
        
        // 2. Separate text sitting before and after your cursor 
        let textBeforeCursor = val.substring(0, cursorIdx); 
        let textAfterCursor = val.substring(cursorIdx); 

        // 3. Match only standard raw alphabetic characters directly behind the cursor 
        let match = textBeforeCursor.match(/([a-zA-ZüÜvV]+)$/); 
        
        if (match) { 
            let activeSyllable = match[1]; 
            let tonedSyllable = addToneMark(activeSyllable, toneNum); 
            
            // 4. Safely reconstruct the string without looking back at finalized syllables 
            let newTextBefore = textBeforeCursor.substring(0, textBeforeCursor.length - activeSyllable.length) + tonedSyllable; 
            inputEl.value = newTextBefore + textAfterCursor; 
            
            // 5. Place cursor exactly where you left off typing 
            let newCursorIdx = newTextBefore.length; 
            inputEl.setSelectionRange(newCursorIdx, newCursorIdx); 
        } 
        
        checkAnswer(); 
    } 
}); 

inputEl.addEventListener('input', () => { 
    checkAnswer(); 
}); 

function checkAnswer() { 
    let userGuess = inputEl.value.toLowerCase().replace(/\s+/g, ''); 
    let target = vocab[currentIdx].pinyin.toLowerCase().replace(/\s+/g, ''); 
    if (userGuess === target) { 
        inputEl.className = "correct"; 
        currentIdx++; 
        setTimeout(loadWord, 200); 
    } 
} 

loadWord(); 
</script> 
</body> 
</html>
